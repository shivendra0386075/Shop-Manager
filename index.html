async function H(p,s){const b=new TextEncoder().encode(s+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of b)h=(h*33^c)>>>0;return'x'+h}

pm=v=>`<div><label>Payment</label><select name="payment"><option value="cash" ${v=='cash'?'selected':''}>cash</option><option value="credit" ${v=='credit'?'selected':''}>credit</option></select></div>`;let h='';

const eff=(c,r)=>c=='sal'?(r.type=='sale'?-r.qty:r.qty):c=='pur'?(r.type=='return'?-r.qty:r.qty):0;

dashboard:()=>{const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),st=per=='day'?d0:per=='week'?new Date(+d0-((n.getDay()+6)%7)*864e5):new Date(n.getFullYear(),n.getMonth(),1),s=fmt(st);
const sum=(a,f)=>r2(a.reduce((x,y)=>x+f(y),0)),inP=a=>a.filter(x=>x.ts>=s),sl=inP(S.sal),m=mv().filter(x=>x.ts>=s);

function R(){const a=$('#app');
if(!ready){a.innerHTML=`<main>${flash()}<p class="mut">Loading…</p></main>`;return}
if(!S.users.some(u=>u.role=='admin')){a.innerHTML=`<main><div class="card" style="max-width:400px;margin:50px auto"><h1>Set up Retail Ledger</h1><p class="mut">Create the Company Admin password. The admin adds all other users.</p>${flash()}<form data-f="setup"><label>Admin password (8+ characters)</label><input name="p" type="password" minlength="8" required autofocus><button class="p">Create admin</button></form></div></main>`;return}
if(!me){a.innerHTML=`<main><div class="card" style="max-width:380px;margin:60px auto"><h1>Sign in</h1>${flash()}<form data-f="login"><label>Username</label><input name="u" autocomplete="username" required autofocus><label>Password</label><input name="p" type="password" autocomplete="current-password" required><button class="p">Sign in</button></form></div></main>`;return}
a.innerHTML=`<nav><b>Retail Ledger</b>${NAV[me.role].map(v=>`<button data-a="go" data-id="${v}" class="${v==view?'on':''}">${LBL[v]}</button>`).join('')}<span class="sp"></span><span>${esc(me.u)} (${me.role})</span><button data-a="out">Sign out</button></nav><main>${flash()}${V[view]()}</main>`}
function flash(){const m=msg;msg='';return m?`<div class="flash" role="status">${esc(m)}</div>`:''}
const F={
async setup(d){if(d.p.length<8)throw Error('Use at least 8 characters.');const sl=salt();await setDoc(ref('users',newId('users')),{u:'admin',s:sl,h:await H(d.p,sl),role:'admin',active:1});await setDoc(doc(db,'meta','settings'),{opening:0,idle:30});msg='Admin created. Sign in as "admin".'},
async login(d){if(Date.now()<lock)throw Error('Too many attempts. Try again in a few minutes.');const u=S.users.find(x=>x.u.toLowerCase()==d.u.trim().toLowerCase()&&x.active);
if(u&&await H(d.p,u.s)==u.h){me=u;fails=0;sessionStorage.setItem('uid',u.id);view=NAV[u.role][0];return}if(++fails>=5){lock=Date.now()+3e5;fails=0}throw Error('Wrong username or password.')},
async addUser(d){const u=d.u.trim();if(!u||d.p.length<8||!ROLES.includes(d.role))throw Error('Enter a username, a role and a password of 8+ characters.');if(S.users.some(x=>x.u.toLowerCase()==u.toLowerCase()))throw Error('That username already exists.');const sl=salt();await setDoc(ref('users',newId('users')),{u,s:sl,h:await H(d.p,sl),role:d.role,active:1});msg='User created.'},
async saveUser(d){const u=S.users.find(x=>x.id==d.id);if(!u||u.role=='admin'||!ROLES.includes(d.role))throw Error('Invalid user.');if(d.p&&d.p.length<8)throw Error('Passwords need 8+ characters.');const o={role:d.role,active:d.active?1:0};if(d.p){o.s=salt();o.h=await H(d.p,o.s)}await updateDoc(ref('users',u.id),o);msg='Saved.'},
async myPw(d){if(d.p.length<8)throw Error('Use at least 8 characters.');const sl=salt();await updateDoc(ref('users',me.id),{s:sl,h:await H(d.p,sl)});msg='Password updated.'},
async saveSet(d){const o=parseFloat(d.o),n=parseInt(d.d);if(!isFinite(o)||!(n>=1))throw Error('Enter valid numbers.');await setDoc(doc(db,'meta','settings'),{opening:r2(o),idle:n});msg='Settings saved.'},
async addCat(d){const n=d.n.trim();if(!n||S.cats.some(c=>c.name.toLowerCase()==n.toLowerCase()))throw Error('Enter a unique category name.');await setDoc(ref('cats',newId('cats')),{name:n});msg='Saved.'},
async renCat(d){const n=d.n.trim(),c=S.cats.find(c=>c.id==d.id);if(!n||!c||S.cats.some(x=>x!==c&&x.name.toLowerCase()==n.toLowerCase()))throw Error('Enter a unique category name.');await updateDoc(ref('cats',c.id),{name:n});msg='Saved.'},
async buy(d){const c=S.cats.find(c=>c.id==d.cat),name=d.item.trim(),qty=q(num(d.qty)),pr=r2(num(d.price)),sp=r2(num(d.sp,1)),pm=pay(d.payment);if(!c||!name)throw Error('Choose a category and enter an item name.');
const ex=S.items.find(i=>i.cat==c.id&&i.name.toLowerCase()==name.toLowerCase()),id=ex?ex.id:newId('items'),t0=now();
await runTransaction(db,async t=>{const r=ref('items',id),cur=ex?(await t.get(r)).data():null;if(cur)t.update(r,{qty:q(cur.qty+qty),pp:pr,sp});else t.set(r,{cat:c.id,name,qty,pp:pr,sp,created:t0,sold:null});
t.set(ref('pur',newId('pur')),{type:'purchase',item:id,qty,price:pr,sp,pay:pm,party:d.party.trim(),paid:pm=='cash'?t0:null,ts:t0,by:me.u})});msg='Recorded at '+t0},
async exp(d){const ds=d.desc.trim(),pm=pay(d.payment),t0=now();if(!ds)throw Error('Describe the expense.');await setDoc(ref('exp',newId('exp')),{desc:ds,amt:r2(num(d.amt)),pay:pm,party:d.party.trim(),paid:pm=='cash'?t0:null,ts:t0,by:me.u});msg='Recorded at '+t0},
async pret(d){const i=item(d.item),qty=q(num(d.qty)),pr=r2(num(d.price)),pm=pay(d.payment),t0=now();if(!i)throw Error('Select an item.');
await runTransaction(db,async t=>{const r=ref('items',i.id),cur=(await t.get(r)).data();if(!cur||qty>cur.qty)throw Error('Not enough stock to return. Available: '+q(cur?cur.qty:0));t.update(r,{qty:q(cur.qty-qty)});t.set(ref('pur',newId('pur')),{type:'return',item:i.id,qty,price:pr,sp:cur.sp,pay:pm,party:d.party.trim(),paid:pm=='cash'?t0:null,ts:t0,by:me.u})});msg='Purchase return recorded at '+t0},
async cashin(d){const t0=now();await setDoc(ref('cashin',newId('cashin')),{amt:r2(num(d.amt)),note:d.note.trim(),ts:t0,by:me.u});msg='Cash added at '+t0},
async sale(d){const i=item(d.item),qty=q(num(d.qty)),amt=r2(num(d.amt,1)),t0=now();if(!i||!['sale','return'].includes(d.type))throw Error('Select an item.');const sale=d.type=='sale',pm=sale?pay(d.payment):'cash';
await runTransaction(db,async t=>{const r=ref('items',i.id),cur=(await t.get(r)).data();if(!cur)throw Error('Item no longer exists.');
if(sale){if(qty>cur.qty)throw Error('Not enough stock. Available: '+q(cur.qty));t.update(r,{qty:q(cur.qty-qty),sold:t0})}else t.update(r,{qty:q(cur.qty+qty)});
t.set(ref('sal',newId('sal')),{item:i.id,qty,amt,sp:cur.sp,type:d.type,pay:pm,party:d.party.trim(),paid:pm=='cash'?t0:null,ts:t0,by:me.u})});msg=(sale?'Sale':'Return')+' recorded at '+t0},
async saveEdit(d){const[c,id]=editing,r=S[c].find(x=>x.id==id);if(!r)throw Error('Record not found.');const u={edited:now()+' by '+me.u};
if(c=='sal'){u.qty=q(num(d.qty));u.amt=r2(num(d.amt,1));u.party=d.party.trim();if(r.type=='sale')u.pay=pay(d.payment)}
if(c=='pur'){u.qty=q(num(d.qty));u.price=r2(num(d.price));u.party=d.party.trim();u.pay=pay(d.payment);if(r.type!='return')u.sp=r2(num(d.sp,1))}
if(c=='exp'){u.desc=d.desc.trim();if(!u.desc)throw Error('Describe the expense.');u.amt=r2(num(d.amt));u.party=d.party.trim();u.pay=pay(d.payment)}
if(u.pay&&u.pay!=(r.pay||'cash'))u.paid=u.pay=='cash'?r.ts:null;await change(c,id,u);editing=null;msg='Transaction updated.'}};
const A={go:id=>view=id,per:id=>per=id,out(){me=null;sessionStorage.removeItem('uid')},
async delUser(id){if(confirm('Delete this user? Past transactions keep the name.')&&S.users.find(u=>u.id==id&&u.role!='admin'))await deleteDoc(ref('users',id))},

async settle(id){const[k,n]=id.split(':'),c={p:'pur',e:'exp',s:'sal'}[k],r=c&&S[c].find(x=>x.id==n);if(!r||r.paid||!(k=='s'?['owner','sales']:['owner','purchaser']).includes(me.role))return;await updateDoc(ref(c,n),{paid:now()});msg='Marked settled. Cash movement recorded now.'},
export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='retail-ledger-backup-'+now().slice(0,10)+'.json';a.click()}};
const can=v=>me&&NAV[me.role].includes(v);
document.addEventListener('submit',async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();try{const PU=['owner','purchaser'],SA=['owner','sales'],G={addUser:['admin'],saveUser:['admin'],saveSet:['admin'],cashin:['admin'],buy:PU,exp:PU,pret:PU,addCat:PU,renCat:PU,sale:SA,saveEdit:['owner']};if(G[f]&&!(me&&G[f].includes(me.role)))throw Error('You do not have permission for that.');await F[f](Object.fromEntries(new FormData(e.target)))}catch(x){msg=x.message}R()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,own={go:1,per:1,out:1};if(!own[a]&&!me)return;

const ops=[];COLS.forEach(n=>(d[n]||[]).forEach(x=>ops.push([n,x])));if(d.set)ops.push(['meta',{id:'settings',...d.set}]);
for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(([n,x])=>{const{id,...y}=x;b.set(ref(n,id),y)});await b.commit()}msg='Backup restored.'}catch(x){msg='Restore failed: '+(x&&x.message||'not a valid backup file.')}R()};r.readAsText(e.target.files[0])});
