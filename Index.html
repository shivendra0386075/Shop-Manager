<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retail Ledger</title><style>
:root{--bg:#eef1f3;--ink:#16252b;--mut:#5d6e75;--line:#cfd8dc;--card:#fff;--brand:#0f4c5c;--accent:#e09f3e;--bad:#b3392f;--good:#2e7d5b}
@media(prefers-color-scheme:dark){:root{--bg:#10191d;--ink:#e6eef0;--mut:#93a6ad;--line:#2b3b42;--card:#17232a;--brand:#0b2f39;--accent:#e8b25f;--bad:#ef8a80;--good:#6fcf9f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
nav{background:var(--brand);display:flex;flex-wrap:wrap;gap:2px;padding:6px 12px;align-items:center;color:#fff}nav b{margin-right:14px;font-size:17px}nav .sp{flex:1}
nav button{color:#fff;padding:8px 12px;border-radius:6px;background:none;border:0;font:inherit;cursor:pointer}nav button:hover,nav button.on{background:rgba(255,255,255,.2)}
main{max-width:1100px;margin:0 auto;padding:20px 14px 60px}h1{font-size:24px;margin:6px 0 14px}h2{font-size:17px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k{border-left:4px solid var(--line);padding:4px 12px}.k small{color:var(--mut);display:block}.k b{font-size:20px;font-variant-numeric:tabular-nums}.k.in{border-color:var(--good)}.k.out{border-color:var(--bad)}.k.w{border-color:var(--accent)}
.drawer{background:var(--brand);color:#fff;border-radius:8px;padding:18px 20px;margin-bottom:16px}.drawer b{display:block;font-size:36px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:13px}.n{text-align:right!important;font-variant-numeric:tabular-nums}.sc{overflow-x:auto}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=radio],input[type=checkbox]{width:auto}.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.opt label{display:inline;font-weight:400;margin-right:16px}
.p{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.s{padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}.d{color:var(--bad)}
.flash{background:#fff4dc;color:#4a3300;border:1px solid var(--accent);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.tabs button{padding:6px 14px;border:1px solid var(--line);border-radius:20px;margin-right:6px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}.tabs .on{background:var(--brand);color:#fff}
.tag{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}.tag.credit{border-color:var(--accent);color:var(--accent)}.neg{color:var(--bad)}.pos{color:var(--good)}.mut{color:var(--mut)}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
</style></head><body><div id="app"></div><script>
const K='retail_ledger_v1';let S=JSON.parse(localStorage.getItem(K)||'null'),me=null,view='',msg='',per='day',fails=0,lock=0;
const save=()=>localStorage.setItem(K,JSON.stringify(S)),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=x=>'₹'+(+x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=x=>Math.round(x*100)/100;
const p2=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,now=()=>fmt(new Date());
const nid=()=>S.nid++;
async function H(p,s){const b=new TextEncoder().encode(s+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of b)h=(h*33^c)>>>0;return'x'+h}
const salt=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16)).join('');
const num=(v,zero)=>{const n=parseFloat(v);if(!isFinite(n)||n<0||(n===0&&!zero)||n>1e9)throw Error('Enter a valid positive number.');return n};
const pay=v=>{if(v!=='cash'&&v!=='credit')throw Error('Choose cash or credit.');return v};
const item=id=>S.items.find(i=>i.id==id),cat=id=>(S.cats.find(c=>c.id==id)||{}).name,iname=id=>{const i=item(id);return i?cat(i.cat)+' / '+i.name:'?'};
const ROLES=['owner','purchaser','sales'],NAV={admin:['users','settings'],owner:['dashboard','sale','buy','payables','cats','stock'],purchaser:['buy','payables','cats','stock'],sales:['sale','stock']};
const LBL={users:'Users',settings:'Settings',dashboard:'Dashboard',sale:'Sales',buy:'Purchases',payables:'Payables',cats:'Categories',stock:'Stock'};
const tbl=(h,rows,empty)=>`<div class="sc"><table><tr>${h.map(x=>`<th class="${x[0]=='#'?'n':''}">${esc(x.replace('#',''))}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${h[i][0]=='#'?'n':''}">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mut">${empty}</td></tr>`}</table></div>`;
const tag=m=>`<span class="tag ${m}">${m}</span>`,q=x=>+(+x).toFixed(3);
const payRadio=`<div class="opt"><label>Paid by</label><label><input type="radio" name="payment" value="cash" checked> Cash</label><label><input type="radio" name="payment" value="credit"> Credit (adds to payables)</label></div>`;
const owed=()=>[...S.pur.filter(p=>p.pay=='credit'&&!p.paid).map(p=>({k:'p',id:p.id,ts:p.ts,l:iname(p.item),party:p.party,a:r2(p.qty*p.price)})),...S.exp.filter(p=>p.pay=='credit'&&!p.paid).map(p=>({k:'e',id:p.id,ts:p.ts,l:p.desc,party:p.party,a:p.amt}))].sort((a,b)=>a.ts<b.ts?-1:1);
const mv=()=>[...S.sal.map(s=>({ts:s.ts,d:s.type=='sale'?s.amt:-s.amt})),...S.pur.map(p=>p.pay=='cash'?{ts:p.ts,d:-p.qty*p.price}:p.paid?{ts:p.paid,d:-p.qty*p.price}:null),...S.exp.map(p=>p.pay=='cash'?{ts:p.ts,d:-p.amt}:p.paid?{ts:p.paid,d:-p.amt}:null)].filter(Boolean);
const payTbl=rows=>tbl(['Date','For','Supplier','#Amount',...(['owner','purchaser'].includes(me.role)?['']:[])],rows.map(r=>[r.ts,esc(r.l),esc(r.party||'-'),inr(r.a),...(['owner','purchaser'].includes(me.role)?[`<button class="s" data-a="settle" data-id="${r.k}:${r.id}">Mark paid</button>`]:[])]),'Nothing owed.');
const V={
users:()=>`<h1>Users</h1><div class="card"><form data-f="addUser"><div class="row"><div><label>Username</label><input name="u" required maxlength="40"></div><div><label>Password (8+ characters)</label><input name="p" type="password" minlength="8" required></div><div><label>Role</label><select name="role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></div></div><button class="p">Create user</button></form></div>
<div class="card">${tbl(['Username','Role','New password','Active',''],S.users.filter(u=>u.role!='admin').map(u=>[esc(u.u),`<form id="u${u.id}" data-f="saveUser"><input type="hidden" name="id" value="${u.id}"></form><select form="u${u.id}" name="role">${ROLES.map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select>`,`<input form="u${u.id}" name="p" type="password" placeholder="leave blank to keep">`,`<input form="u${u.id}" type="checkbox" name="active" ${u.active?'checked':''}>`,`<button class="s" form="u${u.id}">Save</button> <button class="s d" data-a="delUser" data-id="${u.id}">Delete</button>`]),'No users yet. Add a sales executive, purchaser or owner above.')}</div>
<div class="card"><h2 style="margin-top:0">Change my admin password</h2><form data-f="myPw"><input name="p" type="password" minlength="8" required style="max-width:300px"><button class="p">Update password</button></form></div>`,
settings:()=>`<h1>Settings</h1><div class="card" style="max-width:520px"><form data-f="saveSet"><label>Opening cash balance (₹)</label><input name="o" type="number" step="0.01" value="${S.set.opening}" required><label>Mark stock idle after (days without a sale)</label><input name="d" type="number" min="1" value="${S.set.idle}" required><button class="p">Save settings</button></form></div>
<div class="card"><h2 style="margin-top:0">Backup</h2><p class="mut">Data lives in this browser only. Download a backup regularly.</p><button class="s" data-a="export">Download backup</button> <label style="display:inline-block;margin-left:10px">Restore: <input type="file" id="imp" accept=".json" style="width:auto"></label></div>`,
cats:()=>`<h1>Categories</h1><div class="card"><form data-f="addCat" class="row" style="align-items:end"><div><label>New category</label><input name="n" required maxlength="60"></div><div><button class="p" style="margin:0">Add category</button></div></form></div>
<div class="card">${tbl(['Name','#Items',''],S.cats.map(c=>{const n=S.items.filter(i=>i.cat==c.id).length;return[`<form id="c${c.id}" data-f="renCat"><input type="hidden" name="id" value="${c.id}"></form><input form="c${c.id}" name="n" value="${esc(c.name)}" maxlength="60" required>`,n,`<button class="s" form="c${c.id}">Rename</button> ${n?'':`<button class="s d" data-a="delCat" data-id="${c.id}">Delete</button>`}`]}),'No categories yet. Add one to start recording stock.')}</div>`,
buy:()=>`<h1>Purchases and expenses</h1><div class="card"><h2 style="margin-top:0">Add stock purchased</h2>${S.cats.length?'':'<p class="mut">Create a category first.</p>'}<form data-f="buy"><div class="row"><div><label>Category</label><select name="cat" required>${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Item name</label><input name="item" list="nm" required maxlength="80"><datalist id="nm">${[...new Set(S.items.map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><div><label>Quantity</label><input name="qty" type="number" step="any" min="0.001" required></div><div><label>Purchase price (per unit)</label><input name="price" type="number" step="0.01" min="0.01" required></div><div><label>Sale price (per unit)</label><input name="sp" type="number" step="0.01" min="0" required></div><div><label>Supplier (optional)</label><input name="party" maxlength="80"></div></div>${payRadio}<button class="p">Save purchase</button></form></div>
<div class="card"><h2 style="margin-top:0">Add other expense</h2><form data-f="exp"><div class="row"><div><label>What was it for?</label><input name="desc" required maxlength="120"></div><div><label>Amount (₹)</label><input name="amt" type="number" step="0.01" min="0.01" required></div><div><label>Paid to (optional)</label><input name="party" maxlength="80"></div></div>${payRadio}<button class="p">Save expense</button></form></div>
<h2>Latest purchases</h2><div class="card">${tbl(['Time','Item','#Qty','#Cost','#Sale price','Paid','By'],S.pur.slice(-10).reverse().map(p=>[p.ts,esc(iname(p.item)),q(p.qty),inr(p.price),inr(p.sp),tag(p.pay),esc(p.by)]),'No purchases yet.')}</div>`,
payables:()=>{const o=owed();return`<h1>Payables</h1><p>Total owed: <b>${inr(o.reduce((a,b)=>a+b.a,0))}</b>. Marking paid records the cash outflow now.</p><div class="card">${payTbl(o)}</div>`},
sale:()=>`<h1>Sales</h1><div class="card"><form data-f="sale"><div class="opt"><label><input type="radio" name="type" value="sale" checked> Sale</label><label><input type="radio" name="type" value="return"> Return (refund customer)</label></div><div class="row"><div style="grid-column:span 2"><label>Item</label><select name="item" required><option value="">Select item</option>${S.items.slice().sort((a,b)=>iname(a.id)<iname(b.id)?-1:1).map(i=>`<option value="${i.id}">${esc(iname(i.id))} (stock ${q(i.qty)}, ${inr(i.sp)})</option>`).join('')}</select></div><div><label>Quantity</label><input name="qty" type="number" step="any" min="0.001" required></div><div><label>Amount (₹): received for a sale, paid back for a return</label><input name="amt" type="number" step="0.01" min="0" required></div></div><button class="p">Save transaction</button></form></div>
<h2>Latest transactions</h2><div class="card">${tbl(['Time','Type','Item','#Qty','#Amount','By'],S.sal.slice(-10).reverse().map(s=>[s.ts,s.type,esc(iname(s.item)),q(s.qty),`<span class="${s.type=='return'?'neg':''}">${inr(s.amt)}</span>`,esc(s.by)]),'No transactions yet.')}</div>`,
stock:()=>`<h1>Stock</h1><div class="card">${tbl(['Category','Item','#Qty','#Cost','#Sale price','Last sold'],S.items.map(i=>[esc(cat(i.cat)),esc(i.name),q(i.qty),inr(i.pp),inr(i.sp),i.sold||'never']),'No stock yet. Record a purchase to add items.')}</div>`,
dashboard:()=>{const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),st=per=='day'?d0:per=='week'?new Date(+d0-((n.getDay()+6)%7)*864e5):new Date(n.getFullYear(),n.getMonth(),1),s=fmt(st);
const sum=(a,f)=>r2(a.reduce((x,y)=>x+f(y),0)),inP=a=>a.filter(x=>x.ts>=s),sl=inP(S.sal),m=mv().filter(x=>x.ts>=s);
const sales=sum(sl.filter(x=>x.type=='sale'),x=>x.amt),ret=sum(sl.filter(x=>x.type=='return'),x=>x.amt),pu=sum(inP(S.pur),x=>x.qty*x.price),ex=sum(inP(S.exp),x=>x.amt);
const cin=sum(m.filter(x=>x.d>0),x=>x.d),cout=-sum(m.filter(x=>x.d<0),x=>x.d),cash=r2(S.set.opening+sum(mv(),x=>x.d)),o=owed(),cut=fmt(new Date(+n-S.set.idle*864e5));
const idle=S.items.filter(i=>i.qty>0&&(i.sold||i.created)<cut).sort((a,b)=>(a.sold||a.created)<(b.sold||b.created)?-1:1);
const act=[...sl.map(x=>({ts:x.ts,k:x.type=='sale'?'Sale':'Return',d:iname(x.item)+' × '+q(x.qty),a:x.type=='sale'?x.amt:-x.amt,m:'cash',by:x.by})),...inP(S.pur).map(x=>({ts:x.ts,k:'Purchase',d:iname(x.item)+' × '+q(x.qty),a:-x.qty*x.price,m:x.pay,by:x.by})),...inP(S.exp).map(x=>({ts:x.ts,k:'Expense',d:x.desc,a:-x.amt,m:x.pay,by:x.by}))].sort((a,b)=>a.ts<b.ts?1:-1).slice(0,60);
const K=(l,v,c='')=>`<div class="k ${c}"><small>${l}</small><b>${v}</b></div>`;
return`<h1>Dashboard</h1><div class="tabs">${[['day','Today'],['week','This week'],['month','This month']].map(([k,l])=>`<button data-a="per" data-id="${k}" class="${per==k?'on':''}">${l}</button>`).join('')}</div><p class="mut">Since ${s}</p>
<div class="drawer"><small>Cash in hand now (opening ${inr(S.set.opening)} + all cash movements)</small><b>${inr(cash)}</b></div>
<div class="card grid">${K('Sales',inr(sales),'in')+K('Returns',inr(ret),'out')+K('New purchases',inr(pu))+K('Other expenses',inr(ex))+K('Cash in',inr(cin),'in')+K('Cash out',inr(cout),'out')+K('Net cash flow',`<span class="${cin<cout?'neg':'pos'}">${inr(cin-cout)}</span>`)}</div>
<div class="card grid">${K('Stock value at cost',inr(sum(S.items,i=>i.qty*i.pp)))+K('Stock value at sale price',inr(sum(S.items,i=>i.qty*i.sp)))+K('Payables',inr(sum(o,x=>x.a)),'w')+K('Idle items (>'+S.set.idle+' days)',idle.length,'w')}</div>
<h2>Idle stock: no sale in ${S.set.idle}+ days</h2><div class="card">${tbl(['Item','#Qty','#Value at cost','Last moved'],idle.map(i=>[esc(iname(i.id)),q(i.qty),inr(i.qty*i.pp),i.sold||i.created]),'No idle stock.')}</div>
<h2>Payables</h2><div class="card">${payTbl(o)}</div>
<h2>Activity</h2><div class="card">${tbl(['Time','Type','Detail','#Amount','Paid','By'],act.map(x=>[x.ts,x.k,esc(x.d),`<span class="${x.a>0?'pos':'neg'}">${inr(x.a)}</span>`,tag(x.m),esc(x.by)]),'No activity in this period.')}</div>`}};
function R(){const a=$('#app');
if(!S){a.innerHTML=`<main><div class="card" style="max-width:400px;margin:50px auto"><h1>Set up Retail Ledger</h1><p class="mut">Create the Company Admin password. The admin adds all other users.</p>${flash()}<form data-f="setup"><label>Admin password (8+ characters)</label><input name="p" type="password" minlength="8" required autofocus><button class="p">Create admin</button></form></div></main>`;return}
if(!me){a.innerHTML=`<main><div class="card" style="max-width:380px;margin:60px auto"><h1>Sign in</h1>${flash()}<form data-f="login"><label>Username</label><input name="u" autocomplete="username" required autofocus><label>Password</label><input name="p" type="password" autocomplete="current-password" required><button class="p">Sign in</button></form></div></main>`;return}
a.innerHTML=`<nav><b>Retail Ledger</b>${NAV[me.role].map(v=>`<button data-a="go" data-id="${v}" class="${v==view?'on':''}">${LBL[v]}</button>`).join('')}<span class="sp"></span><span>${esc(me.u)} (${me.role})</span><button data-a="out">Sign out</button></nav><main>${flash()}${V[view]()}</main>`}
function flash(){const m=msg;msg='';return m?`<div class="flash" role="status">${esc(m)}</div>`:''}
const F={
async setup(d){if(d.p.length<8)throw Error('Use at least 8 characters.');const s=salt();S={nid:1,users:[{id:1,u:'admin',s,h:await H(d.p,s),role:'admin',active:1}],set:{opening:0,idle:30},cats:[],items:[],pur:[],exp:[],sal:[]};S.nid=2;save();msg='Admin created. Sign in as "admin".'},
async login(d){if(Date.now()<lock)throw Error('Too many attempts. Try again in a few minutes.');const u=S.users.find(x=>x.u.toLowerCase()==d.u.trim().toLowerCase()&&x.active);
if(u&&await H(d.p,u.s)==u.h){me=u;fails=0;sessionStorage.setItem('uid',u.id);view=NAV[u.role][0];return}if(++fails>=5){lock=Date.now()+3e5;fails=0}throw Error('Wrong username or password.')},
async addUser(d){const u=d.u.trim();if(!u||d.p.length<8||!ROLES.includes(d.role))throw Error('Enter a username, a role and a password of 8+ characters.');if(S.users.some(x=>x.u.toLowerCase()==u.toLowerCase()))throw Error('That username already exists.');const s=salt();S.users.push({id:nid(),u,s,h:await H(d.p,s),role:d.role,active:1});save();msg='User created.'},
async saveUser(d){const u=S.users.find(x=>x.id==d.id);if(!u||u.role=='admin'||!ROLES.includes(d.role))throw Error('Invalid user.');if(d.p&&d.p.length<8)throw Error('Passwords need 8+ characters.');u.role=d.role;u.active=d.active?1:0;if(d.p){u.s=salt();u.h=await H(d.p,u.s)}save();msg='Saved.'},
async myPw(d){if(d.p.length<8)throw Error('Use at least 8 characters.');me.s=salt();me.h=await H(d.p,me.s);save();msg='Password updated.'},
saveSet(d){const o=parseFloat(d.o),n=parseInt(d.d);if(!isFinite(o)||!(n>=1))throw Error('Enter valid numbers.');S.set={opening:r2(o),idle:n};save();msg='Settings saved.'},
addCat(d){const n=d.n.trim();if(!n||S.cats.some(c=>c.name.toLowerCase()==n.toLowerCase()))throw Error('Enter a unique category name.');S.cats.push({id:nid(),name:n});save();msg='Saved.'},
renCat(d){const n=d.n.trim(),c=S.cats.find(c=>c.id==d.id);if(!n||!c||S.cats.some(x=>x!==c&&x.name.toLowerCase()==n.toLowerCase()))throw Error('Enter a unique category name.');c.name=n;save();msg='Saved.'},
buy(d){const c=S.cats.find(c=>c.id==d.cat),name=d.item.trim(),qty=q(num(d.qty)),pr=r2(num(d.price)),sp=r2(num(d.sp,1)),pm=pay(d.payment);if(!c||!name)throw Error('Choose a category and enter an item name.');
let i=S.items.find(i=>i.cat==c.id&&i.name.toLowerCase()==name.toLowerCase());if(i){i.qty=q(i.qty+qty);i.pp=pr;i.sp=sp}else S.items.push(i={id:nid(),cat:c.id,name,qty,pp:pr,sp,created:now(),sold:null});
S.pur.push({id:nid(),item:i.id,qty,price:pr,sp,pay:pm,party:d.party.trim(),paid:pm=='cash'?now():null,ts:now(),by:me.u});save();msg='Recorded at '+now()},
exp(d){const ds=d.desc.trim(),pm=pay(d.payment);if(!ds)throw Error('Describe the expense.');S.exp.push({id:nid(),desc:ds,amt:r2(num(d.amt)),pay:pm,party:d.party.trim(),paid:pm=='cash'?now():null,ts:now(),by:me.u});save();msg='Recorded at '+now()},
sale(d){const i=item(d.item),qty=q(num(d.qty)),amt=r2(num(d.amt,1));if(!i||!['sale','return'].includes(d.type))throw Error('Select an item.');
if(d.type=='sale'){if(qty>i.qty)throw Error('Not enough stock. Available: '+q(i.qty));i.qty=q(i.qty-qty);i.sold=now()}else i.qty=q(i.qty+qty);
S.sal.push({id:nid(),item:i.id,qty,amt,type:d.type,ts:now(),by:me.u});save();msg=(d.type=='sale'?'Sale':'Return')+' recorded at '+now()}};
const A={go:id=>view=id,per:id=>per=id,out(){me=null;sessionStorage.removeItem('uid')},
